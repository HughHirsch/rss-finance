# Feeds to collect. One [[feed]] block per feed.
#
# `name` becomes the article's `source`: don't rename a feed or its history splits in two.
# Adding a feed later doesn't give you its past, so err toward more feeds now.

# --- Regulators and official sources: low volume, but they give the cleanest graph edges ---

[[feed]]
name = "Federal Reserve"
url = "https://www.federalreserve.gov/feeds/press_all.xml"

[[feed]]
name = "ECB"
url = "https://www.ecb.europa.eu/rss/press.xml"

[[feed]]
name = "BLS"
url = "https://www.bls.gov/feed/bls_latest.rss"

[[feed]]
name = "SEC"
url = "https://www.sec.gov/news/pressreleases.rss"

[[feed]]
name = "FTC"
url = "https://www.ftc.gov/feeds/press-release.xml"

[[feed]]
name = "DOJ"
url = "https://www.justice.gov/news/rss?type=press_release&m=1"

[[feed]]
name = "CFTC"
url = "https://www.cftc.gov/RSS/RSSGP/rssgp.xml"

